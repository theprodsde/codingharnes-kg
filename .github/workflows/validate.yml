name: Validate skills

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Installer / Windows
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test Windows PowerShell installer
        shell: powershell
        run: |
          .\tests\install.tests.ps1
          .\tests\uninstall.tests.ps1

  linux:
    name: Installer / Linux
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check syntax and test Bash installer
        shell: bash
        run: |
          bash -n ./skill-install.sh ./skill-uninstall.sh ./tests/install.tests.sh ./tests/uninstall.tests.sh
          bash ./tests/install.tests.sh
          bash ./tests/uninstall.tests.sh
