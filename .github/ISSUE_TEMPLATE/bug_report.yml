name: Bug report
description: An installer, skill, or documentation problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        For security problems, do not file an issue. See SECURITY.md.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - PowerShell installer
        - Bash installer
        - Skill content
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the exact command and the output or error.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS, shell and version, harness and version.
      placeholder: Windows 11, PowerShell 5.1, Claude Code 1.x
    validations:
      required: true
